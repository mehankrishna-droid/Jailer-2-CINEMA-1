<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Cinema 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: #fff;
      padding: 10px;
      margin: 0;
    }
    h2 { margin-bottom: 5px; color: #fff; font-size: 24px; }
    p.subtitle { color: #f1c40f; font-size: 13px; margin-bottom: 20px; }
    
    .cinema-container {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
      max-width: 100%;
      padding: 20px 30px;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .row { display: flex; align-items: center; gap: 3px; justify-content: center; }
    .row-label {
      width: 25px; height: 38px; display: flex; align-items: center;
      justify-content: center; font-weight: bold; color: #f1c40f; font-size: 14px;
    }
    .block { display: flex; gap: 3px; }
    
    .kursi {
      width: 32px; height: 38px; background: #2ecc71; color: #fff;
      border-radius: 4px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px;
      font-weight: bold; user-select: none; box-sizing: border-box; padding: 1px;
      cursor: pointer; transition: 0.2s;
    }
    .kursi:hover { opacity: 0.85; transform: scale(1.05); }
    .kursi.occupied { background: #e74c3c !important; color: #fff !important; }
    
    .kursi-nomor { font-size: 10px; opacity: 0.9; line-height: 11px; margin-bottom: 1px; text-align: center; }
    .kursi-nama {
      font-size: 7px; font-weight: 800; line-height: 8px;
      text-transform: uppercase; text-align: center; word-break: break-word; color: #fff;
    }

    /* Warna Kategori Khusus */
    .kursi.extra { background: #1e8449; } 
    .kursi.comfort { background: #2980b9; }

    .stairs-box {
      background: #d4ac0d; color: #000; font-weight: bold; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; width: 67px;
      align-self: stretch;
    }
    
    .entrance-box {
      background: #d4ac0d; color: #000; font-weight: bold; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; width: 42px; /* <-- DIPERLEBAR DARI 30px KE 42px */
      width: 65px;
      align-self: stretch;
      position: relative;
      left: -70px;
    }

    .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; font-weight: bold; font-size: 10px; }
    
    .main-layout { display: flex; gap: 4px; align-items: flex-start; justify-content: center; }
    .grid-rows { display: flex; flex-direction: column; gap: 4px; }

    .layar {
      background: #e0e0e0;
      color: #000;
      padding: 8px;
      margin: 20px auto 15px;
      width: 90%;
      max-width: 700px;
      border-radius: 4px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .rekap-container {
      margin: 25px auto; width: 95%; max-width: 700px; text-align: left; background: #222; padding: 12px; border-radius: 6px; box-sizing: border-box;
    }
    .rekap-container h3 { margin-top: 0; color: #f1c40f; text-align: center; }

    .table-wrapper {
      max-height: 350px; overflow-y: auto; margin-top: 10px; border: 1px solid #444; border-radius: 4px;
    }
    table.rekap-table { width: 100%; border-collapse: collapse; background: #111; }
    table.rekap-table th, table.rekap-table td { border: 1px solid #444; padding: 8px 10px; font-size: 12px; text-align: center; color: #fff; }
    table.rekap-table th { position: sticky; top: 0; background: #333; color: #f1c40f; z-index: 1; }

    .btn-print {
      margin: 15px auto; padding: 10px 20px; background: #f1c40f; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;
    }

    .btn-status {
      padding: 4px 8px; border: none; border-radius: 3px; font-weight: bold; font-size: 10px; cursor: pointer; color: #fff;
    }
    .btn-lunas { background: #27ae60; }
    .btn-belum { background: #e67e22; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .btn-print, .subtitle, .btn-status { display: none !important; }
      .rekap-container { background: #fff !important; color: #000 !important; }
      table.rekap-table { background: #fff !important; }
      table.rekap-table th, table.rekap-table td { color: #000 !important; border-color: #000 !important; }
    }
  </style>
</head>
<body>

  <h2>CINEMA 1</h2>
  <p class="subtitle">Klik pada kursi untuk Mengisi Nama / Mengosongkan Kursi</p>

  <div class="cinema-container" id="cinema"></div>
  <div class="layar">SCREEN</div>

  <button class="btn-print" onclick="window.print()">🖨️ Cetak Rekap Presensi Admin</button>

  <div class="rekap-container">
    <h3>Daftar Pemesan Kursi</h3>
    <div class="table-wrapper">
      <table class="rekap-table">
        <thead>
          <tr>
            <th style="width: 25%;">No. Kursi</th>
            <th>Nama Lengkap Pemesan</th>
            <th style="width: 25%;">Status Pembayaran</th>
            <th class="btn-status" style="width: 20%;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelRekapBody">
          <tr><td colspan="4" style="text-align: center; color: #aaa;">Belum ada kursi terisi</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvzmVqbOG7vacgDI6NaBuuM3nhKMlGbZ0",
      authDomain: "bioskop-jailer-2.firebaseapp.com",
      databaseURL: "https://bioskop-jailer-2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bioskop-jailer-2",
      storageBucket: "bioskop-jailer-2.firebasestorage.app",
      messagingSenderId: "1069180435262",
      appId: "1:1069180435262:web:27a2fb0b3d48b84e4e8a6f",
      measurementId: "G-1SVN8BE69T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const seatsRef = ref(db, 'cinema1/seats');

    const cinemaContainer = document.getElementById('cinema');
    const upperRows = ['B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K', 'L'];
    const clRows = ['C', 'D', 'E', 'F', 'G', 'H', 'J', 'K', 'L'];

    function createLabel(text) {
      const lbl = document.createElement('div');
      lbl.classList.add('row-label');
      lbl.innerText = text;
      return lbl;
    }
function createSeatElement(row, number) {
  const seatCode = `${row}${number}`;
  const seat = document.createElement('div');
  seat.classList.add('kursi');
  if (row === 'D') seat.classList.add('extra');
  
  if (row === 'E') {
    seat.classList.add('comfort');
    
    if (number >= 7 && number <= 10) {
      seat.style.width = '58px';
    } else if (number === 6) {
      seat.style.width = '42px';
    } else if (number === 5) {
      seat.style.width = '50px';
    } else if (number === 4) {
      seat.style.width = '50px';
    } else if (number === 3) {
      seat.style.width = '48px';
      seat.style.marginRight = '28px';
    } else if (number === 2) {
      seat.style.width = '42px';
    } else if (number === 1) {
      seat.style.width = '38px';
    }
  }

  seat.dataset.code = seatCode;
  seat.innerHTML = `<div class="kursi-nomor">${number}</div><div class="kursi-nama"></div>`;

  seat.addEventListener('click', () => handleAdminClick(seatCode));
  return seat;
}
    function buildLayout() {
      cinemaContainer.innerHTML = '';
      
      // BARIS A
      const rowA = document.createElement('div');
      rowA.classList.add('row');
      rowA.appendChild(createLabel('A'));
      
      const blockA_left = document.createElement('div');
      blockA_left.classList.add('block');
      for(let i = 21; i >= 15; i--) { blockA_left.appendChild(createSeatElement('A', i)); }
      rowA.appendChild(blockA_left);

      const blockA_middle = document.createElement('div');
      blockA_middle.classList.add('block');
      for(let i = 14; i >= 13; i--) { blockA_middle.appendChild(createSeatElement('A', i)); }
      rowA.appendChild(blockA_middle);

      const blockA_right = document.createElement('div');
      blockA_right.classList.add('block');
      for(let i = 12; i >= 1; i--) { blockA_right.appendChild(createSeatElement('A', i)); }
      rowA.appendChild(blockA_right);

      rowA.style.marginLeft = "-69px";
      rowA.appendChild(createLabel('A'));
      cinemaContainer.appendChild(rowA);

      // LAYOUT UTAMA B sampai L
      const mainLayout = document.createElement('div');
      mainLayout.classList.add('main-layout');

      // 1. Label Kiri (B sampai L)
      const leftLabels = document.createElement('div');
      leftLabels.classList.add('grid-rows');
      upperRows.forEach(r => leftLabels.appendChild(createLabel(r)));

      // 2. Blok Kiri Kursi
      const midBlock1 = document.createElement('div');
      midBlock1.classList.add('grid-rows');
      upperRows.forEach(r => {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('block');
        if (r === 'B') {
          for(let i = 19; i >= 13; i--) { rowDiv.appendChild(createSeatElement('B', i)); }
        } else {
          let start = (r === 'E') ? 10 : 17;
          let end = (r === 'E') ? 7 : 11;
          for(let i = start; i >= end; i--) { rowDiv.appendChild(createSeatElement(r, i)); }
        }
        midBlock1.appendChild(rowDiv);
      });

      // 3. STAIRS di tengah
      const stairsBox = document.createElement('div');
      stairsBox.classList.add('stairs-box');
      stairsBox.innerHTML = '<span class="vertical-text">STAIRS</span>';

      // 4. Blok Kanan Kursi
      const midBlock2 = document.createElement('div');
      midBlock2.classList.add('grid-rows');
      upperRows.forEach(r => {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('block');
        if (r === 'B') {
          for(let i = 12; i >= 1; i--) { rowDiv.appendChild(createSeatElement('B', i)); }
        } else if (r === 'E') {
          for(let i = 6; i >= 1; i--) {
            if (i === 3) {
              const emptySpace = document.createElement('div');
              emptySpace.style.width = '32px';
              emptySpace.style.height = '38px';
              rowDiv.appendChild(emptySpace);
            }
            rowDiv.appendChild(createSeatElement('E', i));
          }
        } else {
          for(let i = 10; i >= 1; i--) { rowDiv.appendChild(createSeatElement(r, i)); }
        }
        midBlock2.appendChild(rowDiv);
      });

      // 5. Bagian Kanan Luar (Label B di atas, lalu wadah sejajar Entrance & Label C-L di bawahnya)
      const rightWrapper = document.createElement('div');
      rightWrapper.style.display = 'flex';
      rightWrapper.style.flexDirection = 'column';
      rightWrapper.style.gap = '4px';

      // Label B di atas
      const lblB = document.createElement('div');
      lblB.classList.add('row-label');
      lblB.innerText = 'B';
      rightWrapper.appendChild(lblB);

      // Container bawah untuk Entrance dan Label C-L
      const clContainer = document.createElement('div');
      clContainer.style.display = 'flex';
      clContainer.style.gap = '4px';
      clContainer.style.alignItems = 'stretch';

      const entranceBox = document.createElement('div');
      entranceBox.classList.add('entrance-box');
      entranceBox.innerHTML = '<span class="vertical-text">ENTRANCE</span>';

      const clLabels = document.createElement('div');
      clLabels.classList.add('grid-rows');
      clLabels.style.position = 'relative';
      clLabels.style.left = '-66px';
      clRows.forEach(r => clLabels.appendChild(createLabel(r)));

      clContainer.appendChild(entranceBox);
      clContainer.appendChild(clLabels);

      rightWrapper.appendChild(clContainer);

      mainLayout.append(leftLabels, midBlock1, stairsBox, midBlock2, rightWrapper);
      cinemaContainer.appendChild(mainLayout);
    }

    function handleAdminClick(seatCode) {
      const currentSeatRef = ref(db, `cinema1/seats/${seatCode}`);
      
      onValue(currentSeatRef, (snapshot) => {
        const data = snapshot.val();
        const currentNama = (data && data.nama) ? data.nama : '';

        const inputNama = prompt(`Kelola Kursi ${seatCode}:\n- Masukkan Nama untuk memesan/mengubah.\n- Kosongkan teks lalu tekan OK untuk MENGHAPUS/MENGOSONGKAN kursi.`, currentNama);

        if (inputNama !== null) {
          if (inputNama.trim() === '') {
            remove(currentSeatRef);
          } else {
            const isLunas = confirm(`Apakah pemesan atas nama "${inputNama.trim()}" SUDAH LUNAS?\n\n- Klik OK jika LUNAS.\n- Klik Cancel jika PENDING.`);
            set(currentSeatRef, {
              nama: inputNama.trim(),
              statusBayar: isLunas ? 'LUNAS' : 'BELUM'
            });
          }
        }
      }, { onlyOnce: true });
    }

    window.toggleStatusBayar = function(seatCodesStr, currentStatus) {
      const seatCodes = seatCodesStr.split(',');
      const newStatus = (currentStatus === 'LUNAS') ? 'BELUM' : 'LUNAS';
      
      seatCodes.forEach(code => {
        const targetRef = ref(db, `cinema1/seats/${code.trim()}`);
        update(targetRef, { statusBayar: newStatus });
      });
    };

    buildLayout();

    onValue(seatsRef, (snapshot) => {
      const occupiedSeatsData = snapshot.val() || {};
      document.querySelectorAll('.kursi').forEach(seat => {
        const code = seat.dataset.code;
        const number = code.replace(/^[A-Z]+/, '');
        const data = occupiedSeatsData[code];

        if (data) {
          seat.classList.add('occupied');
          const namaPemesan = (typeof data === 'object' && data.nama) ? data.nama : '';
          seat.innerHTML = `<div class="kursi-nomor">${number}</div><div class="kursi-nama">${namaPemesan}</div>`;
        } else {
          seat.classList.remove('occupied');
          seat.innerHTML = `<div class="kursi-nomor">${number}</div>`;
        }
      });

      const tbody = document.getElementById('tabelRekapBody');
      tbody.innerHTML = '';
      const seatCodes = Object.keys(occupiedSeatsData).sort();

      if (seatCodes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #aaa;">Belum ada kursi terisi</td></tr>';
        return;
      }

      const groupedData = {};
      seatCodes.forEach(code => {
        const data = occupiedSeatsData[code];
        const nama = (typeof data === 'object' && data.nama && data.nama.trim() !== '') ? data.nama.trim() : 'Tanpa Nama';
        const status = (typeof data === 'object' && data.statusBayar) ? data.statusBayar : 'BELUM';
        
        const key = `${nama}_${status}`;
        if (!groupedData[key]) {
          groupedData[key] = { nama: nama, status: status, seats: [] };
        }
        groupedData[key].seats.push(code);
      });

      Object.keys(groupedData).forEach(key => {
        const item = groupedData[key];
        const kursiList = item.seats.join(', ');
        const isLunas = item.status === 'LUNAS';
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: bold; text-align: center;">${kursiList}</td>
          <td style="font-weight: bold; text-align: left;">${item.nama}</td>
          <td style="font-weight: bold; color: ${isLunas ? '#2ecc71' : '#e67e22'};">
            ${isLunas ? '✅ LUNAS' : '⏳ PENDING'}
          </td>
          <td class="btn-status">
            <button class="btn-status ${isLunas ? 'btn-belum' : 'btn-lunas'}" onclick="toggleStatusBayar('${kursiList}', '${item.status}')">
              Set ${isLunas ? 'Pending' : 'Lunas'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
